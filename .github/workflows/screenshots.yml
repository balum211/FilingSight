name: Screenshots with the free model
on:
  workflow_dispatch:
  push:
    branches: [screenshots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true > st.log 2>&1 &
          for i in $(seq 1 60); do curl -s localhost:8501/_stcore/health | grep -q ok && break; sleep 2; done
          node scripts/screenshots.js
      - run: |
          git config user.name balum211
          git config user.email 150282045+balum211@users.noreply.github.com
          git add docs/screenshots
          git commit -m "Screenshots taken with the free model" || true
          git push origin HEAD:screenshots
